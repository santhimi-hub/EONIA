<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÉONIA — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #4ade80; 
            --bg: #000; 
            --card: #0c0c0c; 
            --border: #1a1a1a; 
            --blue: #00aaff; 
            --red: #ff5555;
            --orange: #ff8c00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Raleway', sans-serif; -webkit-font-smoothing: antialiased; }

        /* LOADER */
        #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner-logo { width: 60px; animation: spin 2s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .load-txt { font-size: 0.6rem; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }

        .container { max-width: 850px; margin: auto; padding: 20px 15px 120px; opacity: 0; transition: 0.5s; }
        .container.loaded { opacity: 1; }

        /* HEADER & WELCOME */
        .welcome-header { margin-bottom: 20px; border-left: 1px solid var(--accent); padding-left: 15px; }
        .greeting-text { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 4px; }
        h1 { font-size: 1.3rem; font-weight: 300; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
        .sci-name { color: var(--accent); font-size: 0.75rem; font-style: italic; margin-top: 2px; opacity: 0.7; }

        /* Couleurs thermiques */
        .temp-hot { color: var(--orange) !important; }
        .temp-cold { color: var(--blue) !important; }

        .weather-status { width: 100%; font-size: 0.45rem; color: #444; text-align: center; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .weather-bar { display: none; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 15px; margin-bottom: 25px; }
        .weather-item { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .weather-item span { font-size: 0.55rem; font-weight: 600; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .weather-item b { font-size: 0.75rem; color: #fff; margin-top: 5px; }
        .w-icon { font-size: 1.3rem; line-height: 1; margin: 2px 0; }

        .hero-wrapper { width: calc(100% + 40px); margin-left: -20px; border-radius: 0 0 30px 30px; overflow: hidden; border-bottom: 1px solid var(--border); margin-bottom: 25px; }
        .hero-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #111; }

        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 25px; }
        .info-box { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 12px; }
        .info-box.liseret { border-left: 3px solid var(--accent); }
        .label { color: var(--accent); font-size: 0.5rem; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
        .value { font-size: 0.85rem; color: #eee; }

        .dash-block { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .block-title { font-size: 0.6rem; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; font-weight: 600; }
        textarea, input[type="date"], input[type="text"] { width: 100%; background: #080808; border: 1px solid #1a1a1a; color: #fff; padding: 12px; border-radius: 10px; font-family: inherit; margin-top: 5px; outline: none; }
        
        .btn-main { width: 100%; padding: 16px; border-radius: 40px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; text-transform: uppercase; cursor: pointer; font-size: 0.7rem; margin-top: 10px; display: block; text-align: center; text-decoration: none; transition: all 0.2s ease; }
        .btn-main:hover { opacity: 0.8; }
        .btn-water { border-color: var(--blue); color: var(--blue); }
        .btn-cancel { border-color: var(--red); color: var(--red); }
        .btn-save { background: var(--accent); color: #000; border: none; margin-top: 15px; }
        .btn-sub { border-color: #444; color: #aaa; font-size: 0.55rem; padding: 10px; margin-top: 15px; }

        /* NOUVEAUX STYLES ÉONIA PREMIUM */
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.55rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; background: #111; border: 1px solid #222; }
        .status-good { color: var(--accent); border-color: rgba(74, 222, 128, 0.2); }
        .status-warning { color: var(--orange); border-color: rgba(255, 140, 0, 0.2); }
        .status-alert { color: var(--red); border-color: rgba(255, 85, 85, 0.2); }

        .water-tracking-status { margin-top: 15px; font-size: 0.65rem; color: #888; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
        .water-next-status { font-size: 0.6rem; color: #555; text-align: center; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
        .care-recommendation { margin: 15px 0 5px; padding: 15px; background: #080808; border: 1px dashed var(--border); border-radius: 12px; font-size: 0.75rem; color: #aaa; line-height: 1.5; }
        
        .graph-container { display: flex; align-items: flex-end; justify-content: space-between; height: 80px; margin-top: 25px; padding: 0 10px; }
        .graph-day-column { display: flex; flex-direction: column; align-items: center; width: 12%; }
        .graph-bar-pill { width: 100%; border-radius: 6px; transition: 0.3s; }
        .graph-bar-pill.active { background: var(--blue); height: 85%; box-shadow: 0 0 12px rgba(0, 170, 255, 0.45); }
        .graph-bar-pill.inactive { background: #1a1a1a; height: 15%; }
        .graph-day-label { font-size: 0.5rem; color: #555; margin-top: 6px; }

        /* VITALITÉ (Format Épuré Premium) */
        .vitality-wrapper { display: flex; flex-direction: column; align-items: center; margin: 10px 0 20px; }
        .vitality-circle { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; background: #050505; box-shadow: 0 0 20px rgba(74, 222, 128, 0.15); }
        #vitality-score { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .vitality-label { margin-top: 8px; color: #666; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 2px; }

        /* INTERFACE MODALE DIAGNOSTIC IA */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 10000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { background: #0c0c0c; border: 1px solid var(--border); border-radius: 20px; padding: 25px; max-width: 500px; width: 100%; animation: fadeUp .3s ease; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 0.65rem; color: var(--red); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; font-weight: 600; }
        .diagnostic-result { margin-top: 20px; padding: 15px; background: #050505; border: 1px dashed var(--border); border-radius: 12px; font-size: 0.75rem; line-height: 1.6; color: #ccc; display: none; text-align: left; }

        /* ANIMATIONS */
        .dash-block, .info-box, .weather-bar { animation: fadeUp .45s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .info-box { transition: all .25s ease; }
        .info-box:hover { transform: translateY(-3px); border-color: var(--accent); }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 0 18px rgba(74, 222, 128, 0.2); }
        .mon-jardin-only, .collection-only { display: none; }
    </style>
</head>
<body>

<div id="loader">
    <img src="https://raw.githubusercontent.com/santhimi-hub/EONIA/main/file_00000000f43c7243819c00a508d83afc.png" class="spinner-logo">
    <div class="load-txt">Téléchargement...</div>
</div>

<div class="container" id="app">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px;">
        <button onclick="window.location.href='catalogue.html'" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:7px 15px; border-radius:40px; font-size:0.55rem; cursor:pointer;">← RETOUR</button>
        
        <div class="mon-jardin-only">
            <a href="javascript:void(0)" onclick="getLocation()" id="geo-link" style="color: #4ade80; font-size: 0.5rem; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; opacity: 0.6;">
                📍 Météo locale
            </a>
        </div>
    </div>

    <div class="welcome-header">
        <div id="greeting-box" class="greeting-text">...</div>
        <h1 id="p-titre">Chargement...</h1>
        <div id="p-sci" class="sci-name">...</div>
    </div>

    <div class="weather-bar mon-jardin-only" id="weatherBar"></div>

    <div class="hero-wrapper"><img id="p-photo" class="hero-img"></div>
    
    <div class="mon-jardin-only" style="text-align:left;">
        <div id="plant-status-badge" class="status-badge">Analyse...</div>

        <div class="vitality-wrapper">
            <div class="vitality-circle">
                <div id="vitality-score">-</div>
            </div>
            <div class="vitality-label">Vitalité estimée</div>
        </div>

        <div id="plant-mood" class="care-recommendation">Analyse des données en cours...</div>
    </div>

    <div class="mon-jardin-only" id="seasonal-tip-box" class="care-recommendation" style="display:none;"></div>

    <div class="mon-jardin-only dash-block">
        <div class="block-title">SUIVI D'ARROSAGE</div>
        <button class="btn-main btn-water" onclick="waterNow()">💧 ARROSER AUJOURD'HUI</button>
        <button class="btn-main btn-cancel" onclick="removeWater()">✖ ANNULER LE DERNIER ARROSAGE</button>
        
        <div id="last-water" class="water-tracking-status">Aucun arrosage enregistré</div>
        <div id="next-water" class="water-next-status"></div>
        
        <button id="btn-calendar" class="btn-main btn-sub" style="display:none;" onclick="addToCalendar()">📅 Planifier les rappels</button>
        
        <div id="p-graph" class="graph-container"></div>
    </div>

    <div class="info-grid" id="p-grid"></div>

    <div class="mon-jardin-only" style="margin-bottom: 25px;">
        <button class="btn-main btn-cancel" onclick="plantDiagnostic()">🚑 MA PLANTE VA MAL (DIAGNOSTIC IA)</button>
    </div>

    <div class="dash-block">
        <div class="block-title">INFORMATIONS GÉNÉRALES</div>
        <p id="p-desc" style="color:#888; font-size:0.85rem; line-height:1.6;"></p>
    </div>

    <div class="mon-jardin-only dash-block">
        <div class="block-title">TABLEAU DE BORD - JOURNAL</div>
        <div style="margin-bottom:15px;">
            <label class="label">Mon Prénom / Pseudo</label>
            <input type="text" id="user-nickname" placeholder="Ex: Thomas">
        </div>
        <div style="margin-bottom:15px;">
            <label class="label">Date de plantation</label>
            <input type="date" id="date-plant">
        </div>
        <label class="label">Mes notes privées</label>
        <textarea id="p-notes" rows="4" placeholder="Offert par..."></textarea>
        <button class="btn-main btn-save" onclick="saveData()">💾 ENREGISTRER</button>
    </div>

    <div class="collection-only">
        <a href="commander.html" class="btn-main" style="background:var(--accent); color:#000; border:none;">🛒 COMMANDER MA PLAQUE ÉONIA</a>
    </div>
</div>

<div id="diagnosticModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">🚑 DIAGNOSTIC BOTANIQUE IA</div>
        <label class="label" style="text-align: left; display: block;">Décrivez les symptômes observés :</label>
        <textarea id="diag-symptoms" rows="4" placeholder="Ex: Les feuilles du bas jaunissent..."></textarea>
        
        <button id="btn-submit-diag" class="btn-main btn-cancel" style="margin-top:15px;" onclick="submitDiagnostic()">🧬 LANCER L'ANALYSE EXPERTE</button>
        <button class="btn-main btn-sub" onclick="closeDiagnostic()">FERMER</button>
        
        <div id="diag-result" class="diagnostic-result"></div>
    </div>
</div>

<script>
const API_URL = "https://eonia-api.santhimi.workers.dev";
const params = new URLSearchParams(window.location.search);
const plantId = params.get('id');
const plaqueScan = params.get('plaque') || params.get('plaqueId');
const userEmail = localStorage.getItem('user_email') || "invite@eonia.com";

let globalIntervalDays = 7; 
let globalPlantName = "Ma plante";

async function load() {
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': 'EONIA_2026_SECRET' },
            body: JSON.stringify({ plantId, email: userEmail })
        });
        
        const data = await res.json();
        const p = Array.isArray(data) ? data.find(item => item.id === plantId || item.cleanId === plantId) : data;

        if (!p) { window.location.href = "catalogue.html"; return; }

        const loader = document.getElementById('loader');
        if (loader) loader.remove();
        document.getElementById('app').classList.add('loaded');

        // --- GESTION DE L'ACCUEIL ---
        const hour = new Date().getHours();
        const storedName = localStorage.getItem('user_name') || "";
        let greeting = (hour < 12) ? "☀️ Bonjour" : (hour < 19) ? "🌿 Bon après-midi" : "🌙 Bonsoir";
        
        document.getElementById('greeting-box').innerText = storedName ? `${greeting}, ${storedName}` : greeting;
        document.getElementById('p-titre').innerText = p["Nom commun"];
        document.getElementById('user-nickname').value = storedName;
        // ---------------------------

        globalPlantName = p["Nom commun"];
        document.getElementById('p-photo').src = p.Photo;
        document.getElementById('p-sci').innerText = p["Nom scientifique"];
        document.getElementById('p-desc').innerText = p.Description;

        const rubriques = [
            {n:"Famille", v:p.Famille, highlight:true}, {n:"Type", v:p.Type, highlight:true},
            {n:"Floraison", v:p.Floraison}, {n:"Difficulté", v:p.Difficulté},
            {n:"Arrosage", v:p.Arrosage}, {n:"Exposition", v:p.Exposition},
            {n:"Taille Adulte", v:p["Taille à maturité"]}, {n:"Persistance", v:p.Persistance},
            {n:"Rusticité", v:p.Rusticité}
        ];
        document.getElementById('p-grid').innerHTML = rubriques.map(r => `
            <div class="info-box ${r.highlight ? 'liseret' : ''}">
                <div class="label">${r.n}</div>
                <div class="value">${r.v || "-"}</div>
            </div>
        `).join('');

        if (p.est_dans_jardin === true || p.est_dans_jardin === "true") {
            document.querySelectorAll('.mon-jardin-only').forEach(el => el.style.display = 'block');
            document.getElementById('weatherBar').style.display = 'flex';
            document.getElementById('p-notes').value = p.Note_Privee || "";
            document.getElementById('date-plant').value = p.Date_Plantation || "";
            
            if (localStorage.getItem("eonia_lat")) {
                document.getElementById('geo-link').innerText = "📍 Modifier position";
            }
            loadWeather();
            generateSeasonalTip();

            const wateringText = (p.Arrosage || "").toLowerCase();
            if (wateringText.includes("2 fois") || wateringText.includes("modéré")) globalIntervalDays = 4;
            else if (wateringText.includes("3 fois") || wateringText.includes("important")) globalIntervalDays = 2;
            else if (wateringText.includes("15 jours") || wateringText.includes("faible")) globalIntervalDays = 14;
            else globalIntervalDays = 7; 

            const hist = p.Historique_Data || "";
            const dates = hist.split(",").map(d => d.trim()).filter(d => d !== "");

            const badge = document.getElementById("plant-status-badge");
            const nextWaterElement = document.getElementById("next-water");
            const vitalityScore = document.getElementById("vitality-score");
            const plantMood = document.getElementById("plant-mood");
            
            if (dates.length > 0) {
                const lastWaterStr = dates[dates.length - 1];
                document.getElementById("last-water").innerText = "Dernier arrosage : " + lastWaterStr;
                
                const parts = lastWaterStr.split('/');
                const lastWaterDate = new Date(parts[2], parts[1] - 1, parts[0]);
                const today = new Date();
                today.setHours(0,0,0,0);
                lastWaterDate.setHours(0,0,0,0);
                
                const diffTime = Math.abs(today - lastWaterDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                const nextWaterDate = new Date(lastWaterDate);
                nextWaterDate.setDate(lastWaterDate.getDate() + globalIntervalDays);
                
                nextWaterElement.innerText = "Prochain estimé : " + nextWaterDate.toLocaleDateString('fr-FR');
                document.getElementById('btn-calendar').style.display = 'block';

                if (today > nextWaterDate) {
                    badge.innerText = "⚠️ En attente d'eau";
                    badge.className = "status-badge status-alert";
                    vitalityScore.innerText = "50%";
                    plantMood.innerHTML = "⚠️ <b>Stress hydrique détectée :</b> Le sol est sec depuis trop longtemps.";
                } else if (diffDays >= globalIntervalDays - 1) {
                    badge.innerText = "💧 À surveiller";
                    badge.className = "status-badge status-warning";
                    vitalityScore.innerText = "80%";
                    plantMood.innerHTML = "⏳ <b>Substrat s'asséchant :</b> La plante entre en phase de vigilance.";
                } else {
                    badge.innerText = "✨ Parfaitement hydratée";
                    badge.className = "status-badge status-good";
                    vitalityScore.innerText = "98%";
                    plantMood.innerHTML = "✨ <b>Dynamique optimale :</b> Photosynthèse et turgescence excellentes.";
                }
            } else {
                badge.innerText = "🌱 Nouvelle recrue";
                badge.className = "status-badge status-good";
                nextWaterElement.innerText = "En attente du 1er arrosage";
                vitalityScore.innerText = "100%";
                plantMood.innerHTML = "🌱 <b>Phase d'intégration :</b> En attente de votre premier suivi.";
            }

            const graphHtmlElements = [];
            for(let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const ds = d.toLocaleDateString('fr-FR');
                const active = dates.includes(ds);

                graphHtmlElements.push(`
                    <div class="graph-day-column">
                        <div class="graph-bar-pill ${active ? 'active' : 'inactive'}"></div>
                        <div class="graph-day-label">${ds.slice(0,5)}</div>
                    </div>
                `);
            }
            document.getElementById('p-graph').innerHTML = graphHtmlElements.join('');
        } else {
            document.querySelectorAll('.collection-only').forEach(el => el.style.display = 'block');
        }

        if (plaqueScan && !p.est_dans_jardin) {
            setTimeout(() => { proposerAssociation(plaqueScan, p.id, p["Nom commun"]); }, 500);
        }

    } catch(e) { console.error(e); if(document.getElementById('loader')) document.getElementById('loader').remove(); }
}

function generateSeasonalTip() {
    const month = new Date().getMonth(); 
    const tipBox = document.getElementById("seasonal-tip-box");
    if (!tipBox) return;

    let tipText = "";
    if (month >= 2 && month <= 4) tipText = "🌿 <b>Printemps :</b> Période active. Apport d'engrais organique toutes les deux semaines.";
    else if (month >= 5 && month <= 7) tipText = "☀️ <b>Été :</b> Arrosez tôt le matin pour éviter le choc thermique.";
    else if (month >= 8 && month <= 10) tipText = "🍂 <b>Automne :</b> Réduisez progressivement les arrosages.";
    else tipText = "❄️ <b>Hiver :</b> Repos végétatif. Laissez bien sécher le terreau.";

    tipBox.innerHTML = tipText;
    tipBox.style.display = "block";
}

function getLocation() {
    if (confirm("Autoriser la météo locale ?")) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            localStorage.setItem("eonia_lat", lat);
            localStorage.setItem("eonia_lon", lon);
            loadWeather();
            alert("📍 Position enregistrée !");
        }, () => alert("Position refusée."));
    }
}

async function loadWeather() {
    const lat = localStorage.getItem("eonia_lat") || 48.85;
    const lon = localStorage.getItem("eonia_lon") || 2.35;
    try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,weathercode&timezone=auto`);
        const w = await res.json();
        const icon = (c) => (c === 0 ? "☀️" : c <= 3 ? "⛅" : c <= 67 ? "🌧️" : "☁️");
        const tClass = (t) => (t >= 25 ? 'temp-hot' : (t <= 10 ? 'temp-cold' : ''));

        let html = `<div class="weather-status">${localStorage.getItem("eonia_lat") ? "Votre Jardin" : "Météo Paris"}</div><div style="display:flex; width:100%; justify-content:space-between;">`;
        html += w.daily.time.slice(0,4).map((d, i) => {
            const t = Math.round(w.daily.temperature_2m_max[i]);
            const code = w.daily.weathercode[i];
            return `<div class="weather-item"><span>${new Date(d).toLocaleDateString("fr-FR",{weekday:"short"}).toUpperCase()}</span><div class="w-icon">${icon(code)}</div><b class="${tClass(t)}">${t}°</b></div>`;
        }).join("");
        document.getElementById("weatherBar").innerHTML = html + "</div>";
    } catch (e) { console.error("Erreur météo:", e); }
}

async function waterNow() {
    if (!confirm("Confirmer l'arrosage ?")) return;
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': 'EONIA_2026_SECRET' },
            body: JSON.stringify({ action: "water", plantId, email: userEmail })
        });
        const data = await res.json();
        if (data.success) { alert("💧 Arrosage enregistré !"); location.reload(); }
    } catch(e) { alert("Erreur de connexion."); }
}

async function saveData() {
    const note = document.getElementById('p-notes').value;
    const date_plantation = document.getElementById('date-plant').value;
    const nickname = document.getElementById('user-nickname').value;

    // On enregistre le prénom localement
    localStorage.setItem('user_name', nickname);

    await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'x-api-key': 'EONIA_2026_SECRET'},
        body: JSON.stringify({ action: "save_journal", plantId, email: userEmail, note, date_plantation })
    });
    alert("💾 Données mises à jour !");
    location.reload(); // Pour actualiser le message d'accueil en haut
}

async function removeWater() {
    if (!confirm("Supprimer le dernier arrosage ?")) return;
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': 'EONIA_2026_SECRET' },
            body: JSON.stringify({ action: "remove_water", plantId, email: userEmail })
        });
        const data = await res.json();
        if (data.success) { alert("✖ Supprimé"); location.reload(); }
    } catch(e) { alert("Erreur."); }
}

function plantDiagnostic() { document.getElementById('diagnosticModal').classList.add('active'); }
function closeDiagnostic() { document.getElementById('diagnosticModal').classList.remove('active'); }

async function submitDiagnostic() {
    const symptoms = document.getElementById('diag-symptoms').value.trim();
    if (!symptoms) return;
    const resultBox = document.getElementById('diag-result');
    resultBox.style.display = "block";
    resultBox.innerHTML = "<em>Analyse en cours...</em>";
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': 'EONIA_2026_SECRET' },
            body: JSON.stringify({ action: "diagnostic_ia", plantId, email: userEmail, symptoms })
        });
        const data = await res.json();
        resultBox.innerHTML = data.diagnostic.replace(/\n/g, '<br>');
    } catch (e) { resultBox.innerHTML = "Erreur analyse."; }
}

load();
</script>
