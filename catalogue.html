<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÉONIA — Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,200;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Raleway', sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; padding-top: 60px; }
        .top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: flex; justify-content: flex-start; align-items: center; padding: 0 20px; z-index: 3000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-link-top { color: #4ade80; text-decoration: none; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; border: 1px solid rgba(74, 222, 128, 0.3); padding: 7px 18px; border-radius: 20px; transition: 0.3s; }
        .nav-link-top:hover { background: #4ade80; color: #000; }

        header { text-align: center; padding: 30px 20px 10px; }
        .logo-main { width: 70px; margin-bottom: 15px; }
        .brand-title { font-weight: 300; text-transform: uppercase; letter-spacing: 8px; font-size: 2.1rem; }
        #page-title { font-size: 0.7rem; color: #4ade80; margin-top: 8px; letter-spacing: 3px; text-transform: uppercase; }

        /* MENU CLIENT (CACHÉ POUR LES INVITÉS) */
        #client-menu { display: none; justify-content: center; gap: 15px; margin: 20px auto; }
        .nav-btn { background: none; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .nav-btn.active { border-color: #4ade80; color: #4ade80; }

        .controls-area { max-width: 1000px; margin: 0 auto; padding: 0 15px; text-align: center; }
        .search-input { width: 100%; max-width: 450px; padding: 14px; background: #0c0c0c; border: 1px solid #1a1a1a; border-radius: 50px; color: #fff; text-align: center; margin-bottom: 20px; outline: none; }
        .filter-nav { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }
        .f-btn { background: none; border: 1px solid #1a1a1a; color: #777; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 0.6rem; text-transform: uppercase; transition: 0.3s; }
        .f-btn.active { border-color: #4ade80; color: #4ade80; }

        .catalog-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .letter-divider { grid-column: 1 / -1; font-size: 1.5rem; color: #4ade80; margin: 20px 0 10px 0; letter-spacing: 8px; border-bottom: 1px solid rgba(74, 222, 128, 0.1); padding-bottom: 5px; }
        .plant-card { background: #0c0c0c; border-radius: 15px; overflow: hidden; border: 1px solid #1a1a1a; cursor: pointer; transition: 0.3s; }
        .plant-card:hover { transform: translateY(-5px); border-color: #333; }
        .img-container { width: 100%; height: 160px; overflow: hidden; background: #080808; }
        .plant-img { width: 100%; height: 100%; object-fit: cover; }
        .plant-info { padding: 15px 10px; text-align: center; }
        .plant-name { font-size: 0.75rem; color: #ccc; text-transform: uppercase; letter-spacing: 1px; }

        /* IA */
        #ai-bubble { position: fixed; bottom: 25px; left: 20px; width: 60px; height: 60px; background: #000; border: 2px solid #4ade80; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9000; box-shadow: 0 0 15px rgba(74,222,128,0.3); }
        #ai-chat { display: none; position: fixed; bottom: 95px; left: 20px; width: 300px; background: #0c0c0c; border: 1px solid #1a1a1a; border-radius: 20px; z-index: 9001; padding: 20px; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        #ai-messages { height: 200px; overflow-y: auto; font-size: 0.8rem; color: #ccc; margin-bottom: 10px; line-height: 1.5; }
        #ai-input { flex:1; background:#000; border:1px solid #222; color:#fff; padding:10px; border-radius:10px; outline:none; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="index.html" class="nav-link-top">← Accueil</a>
</div>

<header>
    <img src="https://raw.githubusercontent.com/santhimi-hub/EONIA/main/file_00000000f43c7243819c00a508d83afc.png" class="logo-main">
    <h1 class="brand-title">ÉONIA</h1>
    <p id="page-title">Notre Collection</p>
</header>

<div id="client-menu">
    <button id="btn-col" class="nav-btn active" onclick="switchView('catalogue')">Notre Collection</button>
    <button id="btn-jar" class="nav-btn" onclick="switchView('jardin')">Mon Jardin</button>
</div>

<div class="controls-area">
    <input type="text" id="searchBox" class="search-input" placeholder="RECHERCHER UNE PLANTE..." oninput="renderGrid()">
    <div class="filter-nav">
        <button class="f-btn active" onclick="setFilter('all', this)">Tout</button>
        <button class="f-btn" onclick="setFilter('favoris', this)">❤ Favoris</button>
        <button class="f-btn" onclick="setFilter('Fruitier', this)">Fruitiers</button>
        <button class="f-btn" onclick="setFilter('Arbre', this)">Arbres</button>
        <button class="f-btn" onclick="setFilter('Fleur', this)">Fleurs</button>
        <button class="f-btn" onclick="setFilter('Aromate', this)">Aromates</button>
        <button class="f-btn" onclick="setFilter('Potager', this)">Potager</button>
    </div>
</div>

<div id="catalogue-grid" class="catalog-container"></div>
<div id="plant-counter" style="text-align: center; color: #4ade80; font-size: 0.6rem; letter-spacing: 2px; margin-bottom: 20px; font-weight: 500; text-transform: uppercase;">
    0 PLANTE
</div>

<div id="ai-bubble" onclick="toggleAI()">
    <img src="https://raw.githubusercontent.com/santhimi-hub/EONIA/main/file_00000000f43c7243819c00a508d83afc.png" style="width:38px;">
</div>
<div id="ai-chat">
    <h3 style="color:#4ade80; font-size: 0.6rem; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase;">L'Âme d'Éonia</h3>
    <div id="ai-messages">
        <div>✨ Je suis l'Âme d'Éonia. Comment puis-je guider vos pas aujourd'hui ?</div>
    </div>
    <div style="display: flex; gap: 8px; border-top: 1px solid #1a1a1a; padding-top: 15px;">
        <input type="text" id="ai-input" placeholder="Votre message...">
        <button onclick="askAI()" style="background:#4ade80; border:none; width: 35px; height: 35px; border-radius:10px; cursor:pointer;">></button>
    </div>
</div>

<script>
    const API_URL = "https://eonia-api.santhimi.workers.dev";
    let allPlants = [];
    let activeFilter = 'all';
    let currentView = 'catalogue';

    async function loadData() {
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': 'EONIA_2026_SECRET' },
                body: JSON.stringify({ email: localStorage.getItem('user_email') || 'invite@eonia.com' })
            });
            const data = await res.json();
            if (data && !data.error) { 
                allPlants = data;
                if (localStorage.getItem('user_email') !== 'invite@eonia.com' && data.some(p => p.est_dans_jardin)) {
                    document.getElementById('client-menu').style.display = 'flex';
                }
                renderGrid(); 
            }
        } catch (e) { console.error(e); }
    }

    function renderGrid() {
        const grid = document.getElementById('catalogue-grid');
        grid.innerHTML = "";
        const search = document.getElementById('searchBox').value.toLowerCase();
        let filtered = allPlants.filter(p => {
            const name = (p["Nom commun"] || "").toLowerCase();
            if (currentView === 'jardin' && !p.est_dans_jardin) return false;
            const matchSearch = name.includes(search);
            const favs = JSON.parse(localStorage.getItem('eonia_favs') || '[]');
            const isFav = favs.some(f => f.id === p.id);
            if (activeFilter === 'favoris') return matchSearch && isFav;
            return activeFilter === 'all' ? matchSearch : (matchSearch && (p.Type || "").includes(activeFilter));
        });

        let lastLetter = "";
        filtered.forEach(p => {
            const currentLetter = (p["Nom commun"] || "").charAt(0).toUpperCase();
            if (currentLetter !== lastLetter) {
                const divider = document.createElement('div');
                divider.className = 'letter-divider'; divider.innerText = currentLetter;
                grid.appendChild(divider); lastLetter = currentLetter;
            }
            const card = document.createElement('div');
            card.className = 'plant-card';
            card.onclick = () => window.location.href = `jardin.html?id=${p.id}`;
            card.innerHTML = `<div class="img-container"><img src="${p.Photo}" class="plant-img"></div>
                              <div class="plant-info"><div class="plant-name">${p["Nom commun"]}</div></div>`;
            grid.appendChild(card);
        });
    }
    const counterEl = document.getElementById('plant-counter');
    if (counterEl) {
        counterEl.innerText = `${filtered.length} ${filtered.length > 1 ? 'PLANTES' : 'PLANTE'}`;
    }
}
    const counterEl = document.getElementById('plant-counter');
if (counterEl) {
    counterEl.innerText = `${filtered.length} ${filtered.length > 1 ? 'PLANTES' : 'PLANTE'}`;
}

    function setFilter(t, b) {
        activeFilter = t;
        document.querySelectorAll('.f-btn').forEach(x => x.classList.remove('active'));
        if (b) b.classList.add('active');
        renderGrid();
    }

    function switchView(view) {
        currentView = view;
        document.getElementById('btn-col').classList.toggle('active', view === 'catalogue');
        document.getElementById('btn-jar').classList.toggle('active', view === 'jardin');
        document.getElementById('page-title').innerText = view === 'catalogue' ? "Notre Collection" : "Mon Jardin";
        renderGrid();
    }

    function toggleAI() {
        const chat = document.getElementById('ai-chat');
        chat.style.display = (chat.style.display === 'none' || chat.style.display === '') ? 'flex' : 'none';
    }

    async function askAI() {
        const input = document.getElementById('ai-input');
        const msgBox = document.getElementById('ai-messages');
        const question = input.value.trim();
        if (!question) return;
        msgBox.innerHTML += `<div style="text-align:right; color:#4ade80; margin-bottom:12px;">${question}</div>`;
        input.value = "";
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': 'EONIA_2026_SECRET' },
                body: JSON.stringify({ action: "ask_ai", prompt: question })
            });
            const data = await res.json();
            if (data.success) { msgBox.innerHTML += `<div style="margin-bottom:15px; color:#eee;">✨ ${data.answer}</div>`; }
        } catch (e) { msgBox.innerHTML += `<div style="color:red; font-size:0.7rem;">Connexion perdue...</div>`; }
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    document.getElementById("ai-input").addEventListener("keydown", (e) => { if(e.key === "Enter") askAI(); });
    loadData();
</script>
</body>
</html>
